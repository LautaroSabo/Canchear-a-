name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cancheria
          POSTGRES_PASSWORD: cancheria
          POSTGRES_DB: cancheria
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cancheria" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://cancheria:cancheria@localhost:5432/cancheria
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migraciones + seed sobre base limpia
        run: pnpm db:migrate && pnpm db:seed
