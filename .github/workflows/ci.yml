name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://cancheria:cancheria@localhost:5432/cancheria
    steps:
      # Postgres con `docker run` (y no como service container) para poder subir
      # max_connections: los tests abren muchas conexiones en paralelo.
      - name: Postgres 16
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=cancheria -e POSTGRES_PASSWORD=cancheria -e POSTGRES_DB=cancheria \
            postgres:16-alpine -c max_connections=200
          for i in $(seq 1 60); do docker exec pg pg_isready -U cancheria && break; sleep 1; done
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migraciones + seed sobre base limpia
        run: pnpm db:migrate && pnpm db:seed
