services:
  postgres:
    image: postgres:16-alpine
    # Los tests abren muchas conexiones en paralelo (concurrencia + una base por test).
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: cancheria
      POSTGRES_PASSWORD: cancheria
      POSTGRES_DB: cancheria
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cancheria -d cancheria"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
